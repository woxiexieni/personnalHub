syntax = "proto2";

package personalhub;

// =====================
// 系统服务
// =====================

//使用gRPC,尝试链接服务器
service System {
    rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {
}

message PingResponse {
    optional bool ok = 1 [default = false];
    optional string server_version = 2;
}

// =====================
// 分类服务
// =====================

service CategoryService {
    rpc GetCategories (Empty) returns (CategoryList);
}

message Empty {
}

message Category {
    optional int32 id = 1;
    optional string name = 2;
    optional string icon = 3;
    optional int32 sort_order = 4 [default = 0];
    optional bool enabled = 5 [default = true];
    // 0 = 支出，1 = 收入。分类自己带方向，录入页才能分组显示 chips，
    // 服务端也才能校验「支出记录不许引用收入分类」。
    optional int32 direction = 6 [default = 0];
}

message CategoryList {
    repeated Category categories = 1;
    optional int64 updated_at = 2;
}

// =====================
// 记账服务
// =====================

//1.同步账单
//2.手机下拉消费单元
//可扩展，以后可以往里面加自己定义好的服务，如何事件记录上传。
//
service RecordService {
    rpc UploadRecords (UploadRecordsRequest) returns (UploadRecordsResponse);
    rpc GetTodayRecords (Empty) returns (RecordList);
    rpc GetExpenseTrend (TrendRequest) returns (TrendResponse);

    // ---- R1 新增：镜像查询与管理端单条操作 ----
    // ListRecords：手机端拉「最近 30 天」做镜像覆盖；管理端做列表筛选。
    // include_deleted 默认 false —— 默认值必须是「安全值」：忘了传参的调用方只会少拿到墓碑，
    // 不会把已删记录当成正常记录展示出来。镜像同步要显式传 true。
    rpc ListRecords (ListRecordsRequest) returns (RecordList);

    // SaveRecord / DeleteRecord：给电脑端管理界面用（在线、要立刻生效、要人话错误文案）。
    // 手机端的编辑不走这两个，而是把改动塞进下一次 UploadRecords —— 因为手机要能离线改。
    rpc SaveRecord (SaveRecordRequest) returns (SaveRecordResponse);
    rpc DeleteRecord (DeleteRecordRequest) returns (OpResult);
}

//传输的最基本单元：消费单元
message Record {
    optional string id = 1;
    optional double amount = 2;
    optional int32 category_id = 3;
    optional string note = 4;
    optional int64 spent_at = 5;
    optional string pay_method = 6;
    optional int64 created_at = 7;

    // ---- R1 新增（老客户端不传时按默认值处理，老数据零迁移）----
    optional int32 direction = 8 [default = 0];     // 0 支出 / 1 收入
    optional int64 updated_at = 9;                  // 最后修改时间（Unix 毫秒）；0 = 未知版本，服务端直接接受
    optional bool deleted = 10 [default = false];   // 上传时置 true = 软删（不校验业务字段）
}

//上传账单表格
message UploadRecordsRequest {
    repeated Record records = 1;
}
//服务器回复手机消息
message UploadRecordsResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}


message RecordList {
    repeated Record records = 1;
}

// ---- R1 新增：区间查询 ----
// 时间语义统一为「左闭右开」：[from, to)
message ListRecordsRequest {
    optional int64 from = 1;                            // 含（Unix 毫秒）
    optional int64 to = 2;                              // 不含（Unix 毫秒）
    optional int32 direction = 3 [default = -1];        // -1 全部 / 0 支出 / 1 收入
    optional bool include_deleted = 4 [default = false]; // 镜像同步必须显式传 true（要拿墓碑删本地副本）
    optional int32 limit = 5 [default = 0];             // 0 = 不限
}

message SaveRecordRequest {
    optional Record record = 1;
}

message SaveRecordResponse {
    optional bool ok = 1;
    optional Record record = 2;     // 服务端补齐 id / created_at / updated_at 后的最终版本
    optional string error_msg = 3;  // 直接可展示的中文原因（"分类已停用"）
}

message DeleteRecordRequest {
    optional string id = 1;
}

message OpResult {
    optional bool ok = 1;
    optional string error_msg = 2;
}

// =====================
// 分析服务
// =====================
// 统计口径的唯一来源在服务端（固定 UTC+8、左闭右开、整数分累加）。
// 客户端绝不用自己的时区算"今天"，否则手机和服务端会永远差一笔。
service AnalysisService {
    // 今日汇总：手机端「今日总额」的校正值。
    // 手机先用本地数据渲染即时值（0ms、含未同步），这个接口回来后直接覆盖。
    rpc GetTodaySummary (Empty) returns (TodaySummaryResponse);

    // 结构分析：状态页整页数据，一次 RPC 取全。
    // 客户端只传档位（today/week/month/year），**区间由服务端算**并回传 —— 否则两端各算一遍，
    // 迟早出现"手机说本月 3200、网页说 3100"，而且查起来极痛苦。
    rpc GetSpendingStructure (StructureRequest) returns (StructureResponse);
}

message StructureRequest {
    // today | week | month | year（空/无法识别时按 today 处理）
    optional string period = 1;
}

// 一个分类的构成。金额一律用整数「分」：浮点累加会让各占比加起来是 99.98%，用户一眼就看出来。
message CategorySlice {
    optional int32  category_id       = 1;
    optional string name              = 2;  // 服务端补齐；查不到分类时是「未分类」
    optional string icon              = 3;
    optional int64  amount_cents      = 4;
    optional double ratio             = 5;  // 0~1，分母是区间内全部支出
    optional int32  count             = 6;
    optional int64  prev_amount_cents = 7;  // 上一周期同期
    optional double delta_ratio       = 8;  // 0.23 = +23%
    optional bool   has_prev          = 9;  // false 时客户端显示「—」，不要显示「↑100%」
}

// 支付方式构成。老数据是自由文本（"微信"/"微信支付"/"wx"），服务端做归一化后再聚合，
// 否则同一渠道会被拆成三份，占比图永远是错的。
message PayMethodSlice {
    optional string name         = 1;
    optional int64  amount_cents = 2;
    optional double ratio        = 3;
    optional int32  count        = 4;
}

message StructureResponse {
    optional string period            = 1;
    optional int64  range_start       = 2;  // 实际统计区间（左闭右开），客户端显示"10-01 ~ 10-18"
    optional int64  range_end         = 3;
    optional int64  expense_cents     = 4;
    optional int64  income_cents      = 5;
    optional int32  expense_count     = 6;
    optional int64  daily_avg_cents   = 7;  // 按"已过天数"算，不是按整月天数
    optional int64  prev_expense_cents = 8;
    optional double delta_ratio       = 9;
    optional bool   has_prev          = 10;
    optional int64  prev_range_start  = 11;
    optional int64  prev_range_end    = 12;
    repeated CategorySlice  categories  = 13;
    repeated PayMethodSlice pay_methods = 14;
    optional int64  generated_at      = 15;
}

message TodaySummaryResponse {
    optional int64 range_start = 1;    // 今天 00:00（UTC+8），Unix 毫秒
    optional int64 range_end = 2;      // 明天 00:00，Unix 毫秒（左闭右开）
    optional int64 expense_cents = 3;  // 支出合计（分）
    optional int64 income_cents = 4;   // 收入合计（分）
    optional int32 expense_count = 5;  // 支出笔数
    optional int64 generated_at = 6;
}

// =====================
// 事件反思服务（RecordDothingPage）
// =====================
// 与记账完全独立的第二类「可同步记录」：
//   记账 = 结构化短字段（金额/分类）
//   事件反思 = 长文本（10 个字段，多行）
// 之所以不复用 Record，是因为字段维度完全不同（见 personalHub.proto 顶部的设计说明）。
service ThingService {
    rpc UploadThings (UploadThingsRequest) returns (UploadThingsResponse);
    rpc GetTodayThings (Empty) returns (ThingList);
}

// 传输的最基本单元：事件反思单元
// 命名对应本地 ThingRecord，字段一一对齐
message Thing {
    optional string id = 1;
    optional string title = 2;                  // 事件标题
    optional string tag = 3;                    // 事件标签（工作/人际/…）
    optional string emotion = 4;                // 事发时情绪
    optional int64 occurred_at = 5;             // 事件发生时间（Unix 毫秒）
    optional string objective_description = 6;  // 事件简述（只写客观事实）
    optional string initial_thought = 7;        // 事发那一刻的想法
    optional string action_taken = 8;           // 当时采取的行动
    optional string final_result = 9;           // 事件最终结果
    optional string reflection = 10;            // 复盘反思
    optional string action_plan = 11;           // 后续行动计划
    optional int64 created_at = 12;             // 本地创建时间（Unix 毫秒）
}

// 上传事件反思表格
message UploadThingsRequest {
    repeated Thing things = 1;
}

// 服务器回复手机消息
message UploadThingsResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}

message ThingList {
    repeated Thing things = 1;
}

// =====================
// 支出趋势
// =====================

message TrendRequest {
    optional string range = 1;
}

message TrendPoint {
    optional string label = 1;
    optional double amount = 2;
}

message TrendResponse {
    repeated TrendPoint points = 1;
    optional double total = 2;
    optional double daily_avg = 3;
}
// =====================
// 时间块服务（R2）
// =====================
// 与账单 / 事件反思并列的第三类「可同步记录」，但语义完全不同：
//   账单   = 钱的一次流出/流入（时点）
//   事件反思 = 一件值得深挖的事（9 段长文本）
//   时间块 = 一段连续的投入（时长档，绝大多数只有一个 piece_code）
//
// 为什么单独一张表而不是并进 things：
//   时间块一天 6~10 条、零打字；事件反思一周 0~2 条、9 段。
//   合成一张表后每个统计查询都要多带一个 kind 条件，忘一次就串数据。
//   （详见 需求文档/事件时间块与OPDCA-v0.1.md §4.7）
service BlockService {
    rpc UploadBlocks (UploadBlocksRequest) returns (UploadBlocksResponse);
    // 手机端拉最近 30 天做镜像；管理端做区间查询。
    // include_deleted 默认 false：默认值必须是「安全值」。
    rpc ListBlocks (ListBlocksRequest) returns (BlockList);
    // 按片聚合的统计（today / week / month），区间由服务端算并回传，
    // 否则手机和服务端会各算一遍，迟早出现"手机说本周 40 小时、网页说 38 小时"。
    rpc GetPieceStats (PieceStatsRequest) returns (PieceStatsResponse);
}

// 时间块。
// 关键：**除了 piece_code，其余字段全部可空**（半条记录也要能存）。
// 旧事件表单正是死在"全必填"上，这里从协议层就放开。
message Block {
    optional string id = 1;
    optional string piece_code = 2;      // 事情片代号（code 生成后不改，显示名可改）
    optional int64 occurred_at = 3;      // 这段投入归到哪一天的哪一刻（Unix 毫秒，固定 UTC+8 归日）
    optional int32 duration_min = 4;     // 时长（分钟）；0 = 还没填，也合法
    optional string goal_id = 5;         // 归属目标；空 = 没归（不报错）
    optional string note = 6;            // 备注（选填，极少用）
    optional int32 worth = 7 [default = 0];   // 复盘：0 未评 / 1 值得 / 2 一般 / 3 别做
    optional string lesson = 8;          // 只在「值得」时问一句
    optional string plan_id = 9;         // R4 的计划关联
    optional int32 anomaly = 10 [default = 0]; // 0 正常 / 1 跨天或超长待确认（R2.5 计时用）
    optional int32 mood = 11 [default = 0];    // 本版不采集，字段先留着
    optional int64 started_at = 12;      // R2.5 计时：开始
    optional int64 ended_at = 13;        // R2.5 计时：结束
    optional int64 created_at = 14;
    optional int64 updated_at = 15;      // 版本比较；0 = 未知版本，服务端直接接受
    optional bool deleted = 16 [default = false];
}

message UploadBlocksRequest {
    repeated Block blocks = 1;
}

message UploadBlocksResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}

message ListBlocksRequest {
    optional int64 from = 1;                             // 含（Unix 毫秒）
    optional int64 to = 2;                               // 不含（Unix 毫秒）
    optional bool include_deleted = 3 [default = false];  // 镜像同步必须显式传 true
    optional string goal_id = 4;                         // 空 = 全部目标
    optional string piece_code = 5;                      // 空 = 全部片
    optional int32 limit = 6 [default = 0];
}

message BlockList {
    repeated Block blocks = 1;
}

message PieceStatsRequest {
    // today | week | month（空/无法识别时按 today）
    optional string period = 1;
}

message PieceSlice {
    optional string piece_code = 1;
    optional int32 minutes = 2;
    optional int32 count = 3;
}

message PieceStatsResponse {
    optional string period = 1;
    optional int64 range_start = 2;
    optional int64 range_end = 3;
    optional int32 total_minutes = 4;       // 区间总分钟数（今天 1440 / 本周已过 / 本月已过）
    optional int32 covered_minutes = 5;     // 已记录分钟数
    optional int32 unrecorded_minutes = 6;  // total - covered，钳制到 >= 0
    repeated PieceSlice pieces = 7;         // 按分钟降序
    optional int64 generated_at = 8;
}

// =====================
// 目标服务（R2）
// =====================
// 目标层薄到只有四样东西：名字、状态、一条下一步、当前标记。
// 其余（累计投入、最后活动、四周趋势）**全部是查询结果，不存字段** ——
// 存了就会在删块 / 改归属后永久错掉，而且错得看不出来。
service GoalService {
    rpc UploadGoals (UploadGoalsRequest) returns (UploadGoalsResponse);
    rpc ListGoals (Empty) returns (GoalList);
}

message Goal {
    optional string id = 1;
    optional string title = 2;
    // 0 进行中 / 1 暂停 / 2 完成 / 3 放弃
    optional int32 status = 3 [default = 0];
    optional string next_step = 4;       // 「一条下一步」，不是清单；可空
    optional bool is_current = 5 [default = false]; // 录入时新块默认归它（全局最多一个）
    optional int64 started_at = 6;
    optional int64 created_at = 7;
    optional int64 updated_at = 8;
    optional bool deleted = 9 [default = false];

    // ---- 以下是 ListGoals 补上的计算值，客户端不要回传 ----
    optional int32 total_minutes = 10;   // 该目标全部块的 duration_min 之和
    optional int64 last_activity_at = 11; // 最后一次有块的时间；0 = 从未
}

message UploadGoalsRequest {
    repeated Goal goals = 1;
}

message UploadGoalsResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}

message GoalList {
    repeated Goal goals = 1;
}

// =====================
// 每日计划（R4）
// =====================
// 计划回答"今天想把时间给谁"，一天最多 3 条，隔日作废。
// 与目标的区别：目标跨月、要打字、一条线；计划只有今天、只点选、一次意图。
service PlanService {
    rpc UploadPlans (UploadPlansRequest) returns (UploadPlansResponse);
    rpc ListPlans (ListPlansRequest) returns (PlanList);
}

message Plan {
    optional string id = 1;
    optional string day = 2;             // yyyy-MM-dd（固定 UTC+8，不用时间戳是为了不可能有时区歧义）
    optional string piece_code = 3;      // 事情片
    optional int32 budget_min = 4;       // 预算时长；0 = 没设，也合法
    optional string goal_id = 5;         // 归属目标，可空
    optional int64 created_at = 6;
    optional int64 updated_at = 7;       // 版本比较；0 = 未知版本，直接接受
    optional bool deleted = 8 [default = false];
}

message UploadPlansRequest {
    repeated Plan plans = 1;
}

message UploadPlansResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}

message ListPlansRequest {
    optional string day = 1;                              // yyyy-MM-dd；空 = 用 from/to
    optional int64 from = 2;                              // 含（Unix 毫秒）
    optional int64 to = 3;                                // 不含
    optional bool include_deleted = 4 [default = false];
}

message PlanList {
    repeated Plan plans = 1;
}

// =====================
// 行为模式 / 练习（R5）
// =====================
// 回答的是"我对这类事的反应模式"，不是"时间去哪了"。
// 两层：
//   Pattern  = 一个模式的拆解（触发 / 旧反应 / 新反应 / 保留的回报），一季度 2~3 个
//   Practice = 一天 0~1 次的练习记录（只有 result：守住了 or 又回去了）
// 为什么不合成一张表：前者低频高打字，后者高频零打字。
//
// 刻意没有的东西：成功率、连续天数、阶段字段（阶段是系统推断的，客户端可否决）。
service PatternService {
    rpc UploadPatterns (UploadPatternsRequest) returns (UploadPatternsResponse);
    rpc ListPatterns (Empty) returns (PatternList);
    rpc UploadPractices (UploadPracticesRequest) returns (UploadPracticesResponse);
    // 按区间拉练习（手机镜像最近 30 天；管理端可按目标/模式查）
    rpc ListPractices (ListPracticesRequest) returns (PracticeList);
}

message Pattern {
    optional string id = 1;
    optional string title = 2;            // 例：被质疑时不立刻反驳
    optional string trigger = 3;          // 触发场景
    optional string old_response = 4;     // 旧自动反应
    optional string new_response = 5;     // 新反应（必填：它是要练的那个动作）
    optional string reward_kept = 6;      // 保留的回报（不是要消灭的东西）
    optional int32 status = 7 [default = 0]; // 0 活跃 / 1 暂停 / 2 已自动化 / 3 放弃
    optional int64 created_at = 8;
    optional int64 updated_at = 9;
    optional bool deleted = 10 [default = false];
}

message Practice {
    optional string id = 1;
    optional string pattern_id = 2;
    optional int32 result = 3;            // 1 守住了（新反应）/ 0 又回去了（旧反应）
    optional int64 occurred_at = 4;       // 默认"今天"，可改；归因反查靠它
    optional int64 created_at = 5;
    optional int64 updated_at = 6;
    optional bool deleted = 7 [default = false];
}

message UploadPatternsRequest { repeated Pattern patterns = 1; }
message UploadPatternsResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}
message PatternList { repeated Pattern patterns = 1; }

message UploadPracticesRequest { repeated Practice practices = 1; }
message UploadPracticesResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}
message ListPracticesRequest {
    optional string pattern_id = 1;       // 空 = 全部
    optional int64 from = 2;
    optional int64 to = 3;
    optional bool include_deleted = 4 [default = false];
}
message PracticeList { repeated Practice practices = 1; }

// =====================
// 想法（R6）
// =====================
// 想法是**原材料**，不是行动。它只回答一个问题：「我脑子里刚刚冒出来什么」。
//
// 与其它四类的分工（刻意不重叠，否则用户会不知道该记哪个）：
//   账单     → 钱出去了
//   时间块   → 刚才那段时间去哪了（已发生，有时间刻度）
//   事件反思 → 这一件事值得深挖（已发生，9 段，低频深写）
//   行为模式 → 我要改的那一类反应（要练的动作，一季度两三个）
//   想法     → 还没成形的东西（可能永远不成形，也完全可以不处理）
//
// 刻意没有的东西：
//   1. 必选的分类。kind 默认 0（未分类）—— 让人在记的那一秒先想"这算哪类"，
//      就是在记录和入库之间加了一道闸。分类是事后整理的动作，不是记录的动作。
//   2. 任何"处理状态/完成标记"。想法库不是待办清单：攒着不发霉才叫库，
//      一旦有了"未处理"计数，它就会变成第二个待办清单，然后过期、然后焦虑。
//   3. 自动生成目标。只能由用户自己点「转成目标」，系统绝不替他判断哪条想法值得做。
service IdeaService {
    rpc UploadIdeas (UploadIdeasRequest) returns (UploadIdeasResponse);
    rpc ListIdeas (ListIdeasRequest) returns (IdeaList);
}

message Idea {
    optional string id = 1;
    optional string text = 2;              // 正文（必填）
    optional int32 kind = 3 [default = 0]; // 0 未分类 / 1 事实 / 2 评价 / 3 计划行动 / 4 想象脑补
    optional string goal_id = 4;           // 「转成目标」后回填，可空
    optional int64 created_at = 5;
    optional int64 updated_at = 6;         // 版本比较；0 = 未知版本，直接接受
    optional bool deleted = 7 [default = false];
}

message UploadIdeasRequest { repeated Idea ideas = 1; }

message UploadIdeasResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}

message ListIdeasRequest {
    optional int32 kind = 1 [default = -1];  // -1 = 全部
    optional int64 from = 2;                 // 含（Unix 毫秒）
    optional int64 to = 3;                   // 不含
    optional bool include_deleted = 4 [default = false];
}

message IdeaList { repeated Idea ideas = 1; }
