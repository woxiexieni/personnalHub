syntax = "proto2";

package personalhub;

// =====================
// 系统服务
// =====================

//使用gRPC,尝试链接服务器
service System {
    rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {
}

message PingResponse {
    optional bool ok = 1 [default = false];
    optional string server_version = 2;
}

// =====================
// 分类服务
// =====================

service CategoryService {
    rpc GetCategories (Empty) returns (CategoryList);
}

message Empty {
}

message Category {
    optional int32 id = 1;
    optional string name = 2;
    optional string icon = 3;
    optional int32 sort_order = 4 [default = 0];
    optional bool enabled = 5 [default = true];
    // 0 = 支出，1 = 收入。分类自己带方向，录入页才能分组显示 chips，
    // 服务端也才能校验「支出记录不许引用收入分类」。
    optional int32 direction = 6 [default = 0];
}

message CategoryList {
    repeated Category categories = 1;
    optional int64 updated_at = 2;
}

// =====================
// 记账服务
// =====================

//1.同步账单
//2.手机下拉消费单元
//可扩展，以后可以往里面加自己定义好的服务，如何事件记录上传。
//
service RecordService {
    rpc UploadRecords (UploadRecordsRequest) returns (UploadRecordsResponse);
    rpc GetTodayRecords (Empty) returns (RecordList);
    rpc GetExpenseTrend (TrendRequest) returns (TrendResponse);

    // ---- R1 新增：镜像查询与管理端单条操作 ----
    // ListRecords：手机端拉「最近 30 天」做镜像覆盖；管理端做列表筛选。
    // include_deleted 默认 false —— 默认值必须是「安全值」：忘了传参的调用方只会少拿到墓碑，
    // 不会把已删记录当成正常记录展示出来。镜像同步要显式传 true。
    rpc ListRecords (ListRecordsRequest) returns (RecordList);

    // SaveRecord / DeleteRecord：给电脑端管理界面用（在线、要立刻生效、要人话错误文案）。
    // 手机端的编辑不走这两个，而是把改动塞进下一次 UploadRecords —— 因为手机要能离线改。
    rpc SaveRecord (SaveRecordRequest) returns (SaveRecordResponse);
    rpc DeleteRecord (DeleteRecordRequest) returns (OpResult);
}

//传输的最基本单元：消费单元
message Record {
    optional string id = 1;
    optional double amount = 2;
    optional int32 category_id = 3;
    optional string note = 4;
    optional int64 spent_at = 5;
    optional string pay_method = 6;
    optional int64 created_at = 7;

    // ---- R1 新增（老客户端不传时按默认值处理，老数据零迁移）----
    optional int32 direction = 8 [default = 0];     // 0 支出 / 1 收入
    optional int64 updated_at = 9;                  // 最后修改时间（Unix 毫秒）；0 = 未知版本，服务端直接接受
    optional bool deleted = 10 [default = false];   // 上传时置 true = 软删（不校验业务字段）
}

//上传账单表格
message UploadRecordsRequest {
    repeated Record records = 1;
}
//服务器回复手机消息
message UploadRecordsResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}


message RecordList {
    repeated Record records = 1;
}

// ---- R1 新增：区间查询 ----
// 时间语义统一为「左闭右开」：[from, to)
message ListRecordsRequest {
    optional int64 from = 1;                            // 含（Unix 毫秒）
    optional int64 to = 2;                              // 不含（Unix 毫秒）
    optional int32 direction = 3 [default = -1];        // -1 全部 / 0 支出 / 1 收入
    optional bool include_deleted = 4 [default = false]; // 镜像同步必须显式传 true（要拿墓碑删本地副本）
    optional int32 limit = 5 [default = 0];             // 0 = 不限
}

message SaveRecordRequest {
    optional Record record = 1;
}

message SaveRecordResponse {
    optional bool ok = 1;
    optional Record record = 2;     // 服务端补齐 id / created_at / updated_at 后的最终版本
    optional string error_msg = 3;  // 直接可展示的中文原因（"分类已停用"）
}

message DeleteRecordRequest {
    optional string id = 1;
}

message OpResult {
    optional bool ok = 1;
    optional string error_msg = 2;
}

// =====================
// 分析服务
// =====================
// 统计口径的唯一来源在服务端（固定 UTC+8、左闭右开、整数分累加）。
// 客户端绝不用自己的时区算"今天"，否则手机和服务端会永远差一笔。
service AnalysisService {
    // 今日汇总：手机端「今日总额」的校正值。
    // 手机先用本地数据渲染即时值（0ms、含未同步），这个接口回来后直接覆盖。
    rpc GetTodaySummary (Empty) returns (TodaySummaryResponse);

    // 结构分析：状态页整页数据，一次 RPC 取全。
    // 客户端只传档位（today/week/month/year），**区间由服务端算**并回传 —— 否则两端各算一遍，
    // 迟早出现"手机说本月 3200、网页说 3100"，而且查起来极痛苦。
    rpc GetSpendingStructure (StructureRequest) returns (StructureResponse);
}

message StructureRequest {
    // today | week | month | year（空/无法识别时按 today 处理）
    optional string period = 1;
}

// 一个分类的构成。金额一律用整数「分」：浮点累加会让各占比加起来是 99.98%，用户一眼就看出来。
message CategorySlice {
    optional int32  category_id       = 1;
    optional string name              = 2;  // 服务端补齐；查不到分类时是「未分类」
    optional string icon              = 3;
    optional int64  amount_cents      = 4;
    optional double ratio             = 5;  // 0~1，分母是区间内全部支出
    optional int32  count             = 6;
    optional int64  prev_amount_cents = 7;  // 上一周期同期
    optional double delta_ratio       = 8;  // 0.23 = +23%
    optional bool   has_prev          = 9;  // false 时客户端显示「—」，不要显示「↑100%」
}

// 支付方式构成。老数据是自由文本（"微信"/"微信支付"/"wx"），服务端做归一化后再聚合，
// 否则同一渠道会被拆成三份，占比图永远是错的。
message PayMethodSlice {
    optional string name         = 1;
    optional int64  amount_cents = 2;
    optional double ratio        = 3;
    optional int32  count        = 4;
}

message StructureResponse {
    optional string period            = 1;
    optional int64  range_start       = 2;  // 实际统计区间（左闭右开），客户端显示"10-01 ~ 10-18"
    optional int64  range_end         = 3;
    optional int64  expense_cents     = 4;
    optional int64  income_cents      = 5;
    optional int32  expense_count     = 6;
    optional int64  daily_avg_cents   = 7;  // 按"已过天数"算，不是按整月天数
    optional int64  prev_expense_cents = 8;
    optional double delta_ratio       = 9;
    optional bool   has_prev          = 10;
    optional int64  prev_range_start  = 11;
    optional int64  prev_range_end    = 12;
    repeated CategorySlice  categories  = 13;
    repeated PayMethodSlice pay_methods = 14;
    optional int64  generated_at      = 15;
}

message TodaySummaryResponse {
    optional int64 range_start = 1;    // 今天 00:00（UTC+8），Unix 毫秒
    optional int64 range_end = 2;      // 明天 00:00，Unix 毫秒（左闭右开）
    optional int64 expense_cents = 3;  // 支出合计（分）
    optional int64 income_cents = 4;   // 收入合计（分）
    optional int32 expense_count = 5;  // 支出笔数
    optional int64 generated_at = 6;
}

// =====================
// 事件反思服务（RecordDothingPage）
// =====================
// 与记账完全独立的第二类「可同步记录」：
//   记账 = 结构化短字段（金额/分类）
//   事件反思 = 长文本（10 个字段，多行）
// 之所以不复用 Record，是因为字段维度完全不同（见 personalHub.proto 顶部的设计说明）。
service ThingService {
    rpc UploadThings (UploadThingsRequest) returns (UploadThingsResponse);
    rpc GetTodayThings (Empty) returns (ThingList);
}

// 传输的最基本单元：事件反思单元
// 命名对应本地 ThingRecord，字段一一对齐
message Thing {
    optional string id = 1;
    optional string title = 2;                  // 事件标题
    optional string tag = 3;                    // 事件标签（工作/人际/…）
    optional string emotion = 4;                // 事发时情绪
    optional int64 occurred_at = 5;             // 事件发生时间（Unix 毫秒）
    optional string objective_description = 6;  // 事件简述（只写客观事实）
    optional string initial_thought = 7;        // 事发那一刻的想法
    optional string action_taken = 8;           // 当时采取的行动
    optional string final_result = 9;           // 事件最终结果
    optional string reflection = 10;            // 复盘反思
    optional string action_plan = 11;           // 后续行动计划
    optional int64 created_at = 12;             // 本地创建时间（Unix 毫秒）
}

// 上传事件反思表格
message UploadThingsRequest {
    repeated Thing things = 1;
}

// 服务器回复手机消息
message UploadThingsResponse {
    optional int32 accepted_count = 1 [default = 0];
    repeated string failed_ids = 2;
    optional string error_msg = 3;
}

message ThingList {
    repeated Thing things = 1;
}

// =====================
// 支出趋势
// =====================

message TrendRequest {
    optional string range = 1;
}

message TrendPoint {
    optional string label = 1;
    optional double amount = 2;
}

message TrendResponse {
    repeated TrendPoint points = 1;
    optional double total = 2;
    optional double daily_avg = 3;
}